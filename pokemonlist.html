<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .pokemon-search-form {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .pokemon-search-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }

        .pokemon-search-form button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .pokemon-search-form button:hover {
            background-color: #0056b3;
        }

        .pokemon-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Include Token Management and Auth Check -->
    <script src="auth.js"></script>
    <!-- Include Header and Footer Component -->
    <script src="header-footer.js"></script>
    <!-- Include Pokemon API -->
    <script src="pokemon-api-l.js"></script>

    <main>
        <div class="page-container">
            <h2>Pokémon List Viewer</h2>
            <div id="pokemon-display"></div>
        </div>
    </main>

    <script>
        // Function to search for a Pokemon
        document.addEventListener("DOMContentLoaded", () => {
        displayPokemonList('pokemon-display');
        });
        function loadpokemon() {
            loadMorePokemon('pokemon-display');
        }
        
    </script>
</body>
</html>
