<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .pokemon-search-form {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .pokemon-search-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }

        .pokemon-search-form button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .pokemon-search-form button:hover {
            background-color: #0056b3;
        }

        .pokemon-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Include Token Management and Auth Check -->
    <script src="auth.js"></script>
    <!-- Include Header and Footer Component -->
    <script src="header-footer.js"></script>
    <!-- Include Pokemon API -->
    <script src="pokemon-api.js"></script>

    <main>
        <div class="page-container">
            <h2>Pokémon Viewer</h2>
            
            <div class="pokemon-search-form">
                <input 
                    type="text" 
                    id="pokemonInput" 
                    placeholder="Enter Pokémon name (e.g., ditto, pikachu, charizard)"
                    value="ditto"
                />
                <button onclick="searchPokemon()">Search</button>
            </div>

            <div id="pokemon-display"></div>
        </div>
    </main>

    <script>
        // Function to search for a Pokemon
        function searchPokemon() {
            const input = document.getElementById('pokemonInput').value.toLowerCase().trim();
            
            if (!input) {
                alert('Please enter a Pokémon name');
                return;
            }
            
            displayPokemonCard(input, 'pokemon-display');
        }

        // Allow searching by pressing Enter
        document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('pokemonInput');

        if (input) {
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // prevents form reload if inside a form
                    searchPokemon();
                }
            });
        }

        const params = new URLSearchParams(window.location.search);
        const pokemonName = params.get("name")?.toLowerCase();

        if (pokemonName) {
            input.value = pokemonName;
            displayPokemonCard(pokemonName, "pokemon-display");
            return;
        }

        displayPokemonCard('ditto', 'pokemon-display');
        });
    </script>
</body>
</html>
