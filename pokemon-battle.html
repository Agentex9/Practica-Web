<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Batalla Pokémon</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .battle-container {
            width: 95%;
            max-width: 1000px;
            margin: 20px auto;
        }

        .selection-phase {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .pokemon-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }

        .pokemon-selector label {
            font-weight: bold;
            margin-top: 0;
        }

        .pokemon-selector input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .battle-phase {
            display: none;
        }

        .battle-arena {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .pokemon-fighter {
            flex: 1;
            text-align: center;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .pokemon-fighter h3 {
            margin-top: 0;
            font-size: 20px;
        }

        .pokemon-fighter img {
            width: 150px;
            height: 150px;
            margin: 10px 0;
            image-rendering: pixelated;
        }

        .hp-bar-container {
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            height: 30px;
            margin: 15px 0;
            border: 2px solid #333;
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #28a745 0%, #ffc107 50%, #dc3545 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .pokemon-stats-display {
            text-align: left;
            margin: 15px 0;
            font-size: 14px;
        }

        .pokemon-stats-display p {
            margin: 5px 0;
        }

        .turn-info {
            background: #f0f0f0;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .turn-log {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .turn-log .turn-entry {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-left: 4px solid #007BFF;
            border-radius: 4px;
        }

        .turn-log .pokemon-name {
            font-weight: bold;
            color: #007BFF;
        }

        .turn-log .damage {
            color: #dc3545;
            font-weight: bold;
        }

        .turn-log .heal {
            color: #28a745;
            font-weight: bold;
        }

        .turn-log .miss {
            color: #ff6b6b;
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .action-button {
            padding: 12px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .action-button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        .action-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .action-button.locked {
            background-color: #ffc107;
            color: black;
        }

        .battle-end {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            margin: 20px 0;
        }

        .battle-end h2 {
            font-size: 32px;
            margin: 20px 0;
        }

        .battle-end p {
            font-size: 18px;
            margin: 10px 0;
        }

        .turn-counter {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }

        .error-message {
            color: #dc3545;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #dc3545;
            border-radius: 4px;
            background: #f8d7da;
        }

        .success-message {
            color: #28a745;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #28a745;
            border-radius: 4px;
            background: #d4edda;
        }
        .winner-sprite {
            width: 200px;
            margin: 20px auto;
            display: block;
        }

        @media (max-width: 768px) {
            .battle-arena {
                flex-direction: column;
            }

            .pokemon-fighter img {
                width: 120px;
                height: 120px;
            }

            .actions {
                gap: 5px;
            }

            .action-button {
                padding: 10px 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Include Token Management and Auth Check -->
    <script src="auth.js"></script>
    <!-- Include Header and Footer Component -->
    <script src="header-footer.js"></script>
    <!-- Include Pokemon API -->
    <script src="pokemon-api.js"></script>
    <!-- Include Battle Logic -->
    <script src="pokemon-battle.js"></script>

    <main>
        <div class="battle-container">
            <!-- Selection Phase -->
            <div id="selectionPhase" class="selection-phase">
                <div class="pokemon-selector">
                    <label for="pokemon1Input">Pokémon 1:</label>
                    <input type="text" id="pokemon1Input" placeholder="Ej: pikachu" />
                    <button class="action-button" onclick="selectPokemon1()">Seleccionar</button>
                    <div id="pokemon1Selected" style="margin-top: 10px; color: #28a745; font-weight: bold;"></div>
                </div>

                <div class="pokemon-selector">
                    <label for="pokemon2Input">Pokémon 2:</label>
                    <input type="text" id="pokemon2Input" placeholder="Ej: charizard" />
                    <button class="action-button" onclick="selectPokemon2()">Seleccionar</button>
                    <div id="pokemon2Selected" style="margin-top: 10px; color: #28a745; font-weight: bold;"></div>
                </div>
            </div>

            <div id="errorMessage"></div>

            <button id="startBattleBtn" class="action-button" onclick="startBattle()" style="display: none; width: 200px; margin: 20px auto; padding: 15px; font-size: 16px;">Iniciar Batalla</button>

            <!-- Battle Phase -->
            <div id="battlePhase" class="battle-phase">
                <h2 style="text-align: center;">⚡ BATALLA POKÉMON ⚡</h2>

                <div class="turn-counter">
                    Turno: <span id="turnCounter">1</span> / 10
                </div>

                <div class="battle-arena">
                    <!-- Pokémon 1 -->
                    <div class="pokemon-fighter">
                        <h3 id="pokemon1Name"></h3>
                        <img id="pokemon1Sprite" alt="Pokemon 1" />
                        <div class="pokemon-stats-display">
                            <p>Ataque Especial en: <strong id="pokemon1SpecialAttackTurns">Disponible</strong></p>
                            <p>Defensa Especial en: <strong id="pokemon1SpecialDefenseTurns">Disponible</strong></p>
                        </div>
                        <div class="hp-bar-container">
                            <div id="pokemon1HpBar" class="hp-bar" style="width: 100%;">100%</div>
                        </div>
                        <p>HP: <strong id="pokemon1HpText">100/100</strong></p>
                    </div>

                    <!-- Pokémon 2 -->
                    <div class="pokemon-fighter">
                        <h3 id="pokemon2Name"></h3>
                        <img id="pokemon2Sprite" alt="Pokemon 2" />
                        <div class="pokemon-stats-display">
                            <p>Ataque Especial en: <strong id="pokemon2SpecialAttackTurns">Disponible</strong></p>
                            <p>Defensa Especial en: <strong id="pokemon2SpecialDefenseTurns">Disponible</strong></p>
                        </div>
                        <div class="hp-bar-container">
                            <div id="pokemon2HpBar" class="hp-bar" style="width: 100%;">100%</div>
                        </div>
                        <p>HP: <strong id="pokemon2HpText">100/100</strong></p>
                    </div>
                </div>

                <div class="turn-info">
                    <div class="turn-log" id="battleLog"></div>
                </div>

                <div id="currentPlayerTurn" style="text-align: center; font-size: 18px; font-weight: bold; margin: 20px 0; color: #007BFF;"></div>

                <div class="actions" id="battleActions" style="justify-content: center;">
                    <p style="font-size: 16px; color: #666; font-weight: bold;">⚡ La batalla está en progreso... ⚡</p>
                </div>

                <div id="battleEndPhase" style="display: none;"></div>
            </div>
        </div>
    </main>

    <footer>
        <small>© 2026</small>
    </footer>

</body>
</html>
